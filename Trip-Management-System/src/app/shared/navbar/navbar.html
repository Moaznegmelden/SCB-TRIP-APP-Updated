<header class="brand-header mb-4 shadow-sm">

    <div class="container-fluid d-flex justify-content-between align-items-center">

        <div class="scb-logo-container">

            <div class="scb-logo-waves">
                <div class="scb-wave"></div>
                <div class="scb-wave"></div>
                <div class="scb-wave"></div>
            </div>

            <div class="scb-logo-text">
                Suez Canal<br>
                Bank
            </div>

        </div>

        <button
            class="btn user-dropdown-btn d-flex align-items-center gap-2 border-0">

            <div class="avatar-circle">

                {{ initials }}

            </div>

            <div class="text-start d-none d-sm-block">

                <div
                    class="fw-bold text-dark"
                    style="font-size:13px">

                    {{ userName }}

                </div>

                <div
                    class="text-muted"
                    style="font-size:11px">

                    {{ userRole }}

                </div>

            </div>

        </button>

    </div>

</header>
