<header class="brand-header">
<div class="scb-logo-container">
  <div class="scb-logo-waves">
    <div class="scb-wave"></div>
    <div class="scb-wave"></div>
    <div class="scb-wave"></div>
  </div>
  <div class="scb-logo-text">Suez Canal Bank</div>
</div>
<div class="header-brand-line"></div>
<div class="user-dropdown-container">
  <button class="user-profile-btn" type="button">
    <div class="avatar-circle">HU</div>
    <div class="user-info">
      <span class="user-name">HR User</span>
      <span class="user-role">Administration</span>
    </div>
  </button>
</div>
</header>

<div class="container-fluid px-4">
  <form (ngSubmit)="onSubmit()">

    <div class="top-bar d-flex justify-content-between align-items-center pb-2 mb-3">
      <div class="fw-bold text-scb text-uppercase small">Administration / Trips</div>
    </div>

    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h3 class="fw-bold text-scb mb-1">Create trip</h3>
        <p class="text-muted small mb-0">Configure the trip, departures, eligibility, capacity and approval rules before publication.</p>
      </div>
      <div>
        <button type="submit" name="action" value="submit" class="btn btn-scb-primary" [disabled]="submitting">Submit for approval</button>
      </div>
    </div>

    <div class="row g-4">

      <div class="col-lg-12">
        <div class="card border-light-subtle shadow-sm p-4">
          <h5 class="fw-bold text-scb border-bottom pb-2 mb-4">Trip information</h5>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label for="title" class="form-label">Trip title *</label>
              <input type="text" id="title" name="title" class="form-control" [(ngModel)]="title" placeholder="e.g. Steigenberger El Gouna" required>
            </div>
            <div class="col-md-4">
              <label for="destination" class="form-label">Destination *</label>
              <input type="text" id="destination" name="destination" class="form-control" [(ngModel)]="destination" placeholder="e.g. El Gouna" required>
            </div>
            <div class="col-md-4">
              <label for="duration" class="form-label">Duration *</label>
              <input type="text" id="duration" name="duration" class="form-control" [(ngModel)]="duration" placeholder="e.g. 5 days / 4 nights" required>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label for="registrationOpens" class="form-label">Registration opens *</label>
              <input type="datetime-local" id="registrationOpens" name="registrationOpens" class="form-control" [(ngModel)]="registrationOpens" required>
            </div>
            <div class="col-md-3">
              <label for="registrationCloses" class="form-label">Registration closes *</label>
              <input type="datetime-local" id="registrationCloses" name="registrationCloses" class="form-control" [(ngModel)]="registrationCloses" required>
            </div>



          <div class="departures-box">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
              <h6 class="fw-bold text-scb text-uppercase m-0">Batches</h6>
            </div>

            <div class="row g-3 align-items-end mb-3" *ngFor="let dep of departures; let i = index">
              <div class="col-md-3">
                <label [for]="'startDate-' + i" class="form-label">Start date ({{ i + 1 }}) *</label>
                <input type="date" [id]="'startDate-' + i" [name]="'startDate-' + i" class="form-control form-control-lg fs-6" [(ngModel)]="dep.startDate" required>
              </div>
              <div class="col-md-3">
                <label [for]="'endDate-' + i" class="form-label">End date ({{ i + 1 }}) *</label>
                <input type="date" [id]="'endDate-' + i" [name]="'endDate-' + i" class="form-control form-control-lg fs-6" [(ngModel)]="dep.endDate" required>
              </div>

              <div class="col-md-2 text-end">
                <button type="button" class="btn btn-link text-danger text-decoration-none fw-bold p-0 pb-2" (click)="removeDeparture(i)">Remove</button>
              </div>
            </div>

            <button type="button" class="btn btn-scb-outline border-dashed btn-md mt-2" (click)="addDeparture()">+ Add Batch</button>
          </div>
        </div>
      </div>

    </div>

</div>
