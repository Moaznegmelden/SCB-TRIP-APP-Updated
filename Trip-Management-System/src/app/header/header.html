<!-- =========================
     HEADER
========================= -->

<header class="brand-header">

  <!-- =========================
       SCB LOGO
  ========================== -->

  <div class="scb-logo-container">

    <div class="scb-logo-waves">
      <div class="scb-wave"></div>
      <div class="scb-wave"></div>
      <div class="scb-wave"></div>
    </div>

    <div class="scb-logo-text">
      Suez Canal Bank
    </div>

  </div>


  <!-- =========================
       BLUE LINE
  ========================== -->

  <div class="header-brand-line"></div>


  <!-- =========================
       CURRENT USER
  ========================== -->

  <div
    class="user-dropdown-container"
    *ngIf="currentUser">

    <button
      class="user-profile-btn"
      type="button">

      <div class="avatar-circle">
        {{ initials }}
      </div>

      <div class="user-info">

        <span class="user-name">
          {{ roleLabel }} · {{ displayName }}
        </span>

        <span class="user-role">
          {{ roleLabel }}
        </span>

      </div>

    </button>

  </div>

</header>


<!-- =========================
     NAVIGATION
========================= -->

<div class="top-bar page-shell-nav">

  <!-- =========================
       BREADCRUMB
  ========================== -->

  <div class="breadcrumb">
    Portal
  </div>


  <!-- =========================
       NAVIGATION LINKS
  ========================== -->

  <ul class="page-nav-links">


    <!-- =====================================================
         TRIPS
         COMMON TO ALL USERS
    ====================================================== -->

    <li>

      <a
        routerLink="/employee-dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        Trips

      </a>

    </li>


    <!-- =====================================================
         MY REQUESTS
         COMMON TO ALL USERS
    ====================================================== -->

    <li>

      <a
        routerLink="/my-requests"
        routerLinkActive="active">

        My requests

      </a>

    </li>


    <!-- =====================================================
         HISTORY
         COMMON TO ALL USERS
    ====================================================== -->

    <li>

      <a
        routerLink="/history"
        routerLinkActive="active">

        History

      </a>

    </li>


    <!-- =====================================================
         CREATE TRIPS
         HR ADMIN ONLY
    ====================================================== -->

    <li *ngIf="canCreateTrips()">

      <a
        routerLink="/admin/trips/create"
        routerLinkActive="active">

        Create Trips

      </a>

    </li>


    <!-- =====================================================
         TASKS
         ROLE-BASED
    ====================================================== -->

    <li *ngIf="hasTasks()">


      <!-- ===================================================
           LINE MANAGER
           Employee Application Approvals
      ==================================================== -->

      <a
        *ngIf="isLineManager()"
        routerLink="/manager-approval"
        routerLinkActive="active">

        Tasks

      </a>


      <!-- ===================================================
           HR ADMIN
           Employee Selection
      ==================================================== -->

      <a
        *ngIf="isHrAdmin()"
        routerLink="/admin/trips/selection"
        routerLinkActive="active">

        Tasks

      </a>


      <!-- ===================================================
           HR MANAGER
           Trip + Selection Approvals
      ==================================================== -->

      <a
        *ngIf="isHrManager()"
        routerLink="/admin/trips/approvals"
        routerLinkActive="active">

        Tasks

      </a>


      <!-- ===================================================
     HR ADMIN + HR MANAGER
     Announcements
=================================================== -->

<a
  *ngIf="isHrAdmin() || isHrManager()"
  routerLink="/admin/trips/announcement"
  routerLinkActive="active">

  Go to Announcements

</a>

    </li>


    <!-- =====================================================
         APPROVAL HISTORY
         LINE MANAGER ONLY
    ====================================================== -->

    <li *ngIf="canViewApprovalHistory()">

      <a
        routerLink="/approval-history"
        routerLinkActive="active">

        Approval History

      </a>

    </li>


  </ul>

</div>
