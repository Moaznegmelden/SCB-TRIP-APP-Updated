spring.application.name=tripsystem

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=trips;encrypt=false;trustServerCertificate=true
spring.datasource.username=trips_user
spring.datasource.password=Trips@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl